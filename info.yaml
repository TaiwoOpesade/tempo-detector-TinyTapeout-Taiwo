# TinyTapeout project configuration.
# See: https://tinytapeout.com/hdl/config/

project:
  title:        "Hardware Audio Tempo Detector"
  author:       "Taiwo Opesade"
  discord:      ""
  description:  "Detects the tempo (BPM) of a live audio stream entirely in hardware, using onset detection and a bit-serial divider - no CPU, no multiplier."
  language:     "Verilog"
  clock_hz:     50000000

  source_files:
    - "project.v"
    - "onset_detector.v"
    - "interval_counter.v"
    - "tempo_estimator.v"
    - "bpm_divider.v"
    - "result_latch.v"
  top_module:  "tt_um_taiwoopesade_tempo_detector"

  tiles: "1x1"

pinout:
  ui_in:
    - "audio_sample[0] - streaming amplitude sample bit 0 (LSB)"
    - "audio_sample[1]"
    - "audio_sample[2]"
    - "audio_sample[3]"
    - "audio_sample[4]"
    - "audio_sample[5]"
    - "audio_sample[6]"
    - "audio_sample[7] - streaming amplitude sample bit 7 (MSB)"
  uo_out:
    - "bpm_estimate[0] - latched BPM estimate, bit 0 (LSB)"
    - "bpm_estimate[1]"
    - "bpm_estimate[2]"
    - "bpm_estimate[3]"
    - "bpm_estimate[4]"
    - "bpm_estimate[5]"
    - "bpm_estimate[6]"
    - "bpm_estimate[7] - latched BPM estimate, bit 7 (MSB)"
  uio_in:
    - "sample_valid - strobe: a new audio_sample is present this cycle"
    - "frame_reset - restart tempo tracking (new track/song)"
    - "unused"
    - "unused"
    - "unused"
    - "unused"
    - "unused"
    - "unused"
  uio_out:
    - "unused"
    - "unused"
    - "beat_pulse - one-cycle pulse on each detected beat onset"
    - "tempo_locked - high once recent intervals are stable"
    - "onset_active - raw pre-refractory onset flag (debug)"
    - "overflow_flag - no beat seen recently (silence / very slow)"
    - "confidence[0] - stability score, bit 0 (2'b11 = tightest lock)"
    - "confidence[1] - stability score, bit 1"

# Do not change:
yaml_version: 6
